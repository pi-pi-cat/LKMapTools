# ══════════════════════════════════════════════════════════════════
#  LKMapTools 配置文件
#  修改后保存即可生效（部分参数需要重启程序）
#  注释以 # 开头，保存时自动保留
# ══════════════════════════════════════════════════════════════════

config_path = "config\\settings.toml"

# ── 截图区域 ─────────────────────────────────────────────────────
# 小地图在屏幕上的位置和尺寸（通过程序内框选自动设置）
# 全 0 表示尚未配置，一般不需要手动修改
[capture_region]
left = 2099
top = 174
width = 166
height = 166

# ── 素材路径 ─────────────────────────────────────────────────────
[assets]
map_path = "assest/raw.png"
# 去除边缘的特征地图（用于模板匹配）
feature_map_path = "assest/raw_noedge.png"
# 资源点位数据
points_path = "assest/points.json"
# ORB 特征缓存路径
feature_cache_path = "cache/orb_features.npz"
legacy_feature_cache_path = "assest/ORB_features.npz"

# ── 视图设置（程序内自动保存）────────────────────────────────────
[view]
zoom = 1.7152597367791003
show_resources = true

# ── ORB 特征匹配参数 ────────────────────────────────────────────
[orb]
# 大地图 / 小地图提取的特征点数量
map_nfeatures = 300000
minimap_nfeatures = 2500
min_match_count = 5
scale_factor = 1.2
nlevels = 8
fast_threshold = 5
edge_threshold = 25
# 特征点网格划分
grid_rows = 120
grid_cols = 120
max_kp_per_layer = 100000
refresh_interval_ms = 16
# 本地搜索半径（大地图像素）
local_search_radius = 800
local_search_expand_step = 200
global_search_after_failures = 10
match_distance_threshold = 50
max_good_matches = 80
ransac_threshold = 3.0
# 跳变检测阈值（大地图像素）
jump_limit = 220
min_valid_scale = 0.35
max_valid_scale = 2.2

# ── 模板匹配定位器参数（主要定位方式）──────────────────────────
[template]

# 全局搜索遍历的缩放比例列表（小地图像素 : 大地图像素）
global_scales = [0.8, 0.9, 1.0, 1.1, 1.15, 1.2, 1.25, 1.3, 1.4, 1.6]

# 粗筛金字塔降采样倍数（越大越快，精度越低）
pyramid_factor = 4

# 粗筛阶段最低得分（低于此值不进入精化）
coarse_threshold = 0.12

# 精化/本地匹配最低置信度（低于此值视为失败）
match_threshold = 0.3

# Canny 边缘检测低/高阈值
canny_low = 50
canny_high = 150

# 本地搜索半径（大地图像素）
local_search_radius = 500
# 连续失败时每次扩大的搜索半径增量
local_expand_step = 150
# 连续失败多少次后切换到全局搜索
global_search_after_failures = 8

# 跳变检测阈值（大地图像素）
jump_limit = 250
# 定位刷新间隔（毫秒）
refresh_interval_ms = 16

# ── 光流追踪 ─────────────────────────────────────────────────────
# 在无纹理区域（草地等）用光流代替模板匹配，提高追踪连续性
use_optical_flow = true
# 每隔多少帧用模板校正一次光流漂移
flow_validation_interval = 15
# 光流一致性阈值（超出则降级到模板匹配）
flow_consistency_threshold = 3.0
# 模板校正死区（大地图像素，漂移小于此值时忽略）
correction_min_drift = 12
# 校正偏移分摊帧数（越大越平滑，修正越慢）
correction_smooth_frames = 8

# ── 传送 / 场景切换检测 ──────────────────────────────────────────
# 小地图平均亮度低于此值时判定为黑屏/传送画面（0~255）
transition_dark_threshold = 15
# 传送画面模板图路径（留空则只用黑屏检测）
transition_template_path = ""
# 全局搜索连续失败超过此次数 → 判定不在大地图范围内
offmap_max_failures = 30

# ── 搜索与恢复 ───────────────────────────────────────────────────
# SEARCHING 状态下每隔多少帧执行一次全局搜索（限流）
searching_interval = 4
# 跟踪失败后先尝试本地搜索最多这么多帧，再切全局
local_recovery_frames = 6
# 直方图场景突变阈值（正常 0.80~0.95，传送/菜单切换通常 < 0.65）
hist_scene_break_threshold = 0.7

# ── 静止检测 ─────────────────────────────────────────────────────
# 光流每帧位移小于此值时认为画面静止（小地图像素）
static_flow_threshold = 0.5
# 连续静止帧数达到此值时强制做一次模板位置验证
static_verify_interval = 30

# ── 性能配置 ─────────────────────────────────────────────────────
# 是否启用 CUDA 加速（需要 NVIDIA GPU + opencv-contrib-python）
use_cuda = true
# Farneback 光流参数（越小越快，越大越平滑）
flow_win_size = 11
flow_levels = 2
flow_iterations = 2

# ── 坐标偏移补偿 ─────────────────────────────────────────────────
# 输出坐标偏移（大地图像素），用于修正系统性定位误差
position_offset_x = 0
position_offset_y = 0

# ── 玩家图标遮罩 ─────────────────────────────────────────────────
# 定位时挖去玩家箭头区域，避免干扰模板匹配
# 框选小地图时自动检测，一般不需要手动修改
[icon_mask]
# 图标中心相对于截图区域左上角的坐标（-1 = 未检测到，使用中心兜底）
x = 84
y = 82
# 遮罩半径（像素）
radius = 15
