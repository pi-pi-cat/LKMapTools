[project]
name = "lkmaptools"
version = "0.2.0"
description = "PySide6-based game map tracking and navigation foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mss>=10.1.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pyside6>=6.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lkmap"]
