[project]
name = "lkmaptools"
version = "0.2.0"
description = "PySide6-based game map tracking and navigation foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.1.0",
    "numpy>=2.4.4",
    "opencv-contrib-python",
    "pyside6>=6.9.0",
    "tomlkit>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lkmap"]

[tool.uv.sources]
opencv-contrib-python = { path = "../../../Downloads/opencv_contrib_python-4.13.0.90-cp37-abi3-win_amd64.whl" }
